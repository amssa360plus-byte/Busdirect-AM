        <div class="section">
            <div class="flex flex-col gap-6">
                <section aria-labelledby="reserve-title"
                    class="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:p-5">
                    <h2 id="reserve-title" class="mb-3 text-base font-bold text-slate-900">New reservation</h2>
                    <form id="reserve-form" novalidate>
                        <label for="reserve-name" class="mb-1 block text-sm font-semibold text-slate-700">Passenger
                            name</label>
                        <input id="reserve-name" name="reserve-name" type="text" autocapitalize="none"
                            enterkeyhint="done" autocomplete="off" maxlength="60" placeholder="e.g. Ahmed Amine"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm placeholder:text-slate-400" />
                        <label for="reserve-seat" class="mb-1 block text-sm font-semibold text-slate-700">Seat
                            (optional)</label>
                        <select id="reserve-seat" name="reserve-seat"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pr-9 text-sm">
                            <option value="">Choose a seat</option>
                            <option value="1">Seat 1</option>
                            <option value="2">Seat 2</option>
                            <option value="3">Seat 3</option>
                            <option value="4">Seat 4</option>
                            <option value="5">Seat 5</option>
                            <option value="6">Seat 6</option>
                            <option value="7">Seat 7</option>
                            <option value="8">Seat 8</option>
                            <option value="9">Seat 9</option>
                            <option value="10">Seat 10</option>
                            <option value="11">Seat 11</option>
                            <option value="12">Seat 12</option>
                            <option value="13">Seat 13</option>
                            <option value="14">Seat 14</option>
                            <option value="15">Seat 15</option>
                            <option value="16">Seat 16</option>
                            <option value="17">Seat 17</option>
                            <option value="18">Seat 18</option>
                            <option value="19">Seat 19</option>
                            <option value="20">Seat 20</option>
                        </select>
                        <button type="submit" id="reserve-submit"
                            class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-gray-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-gray-600 active:bg-teal-600 disabled:cursor-not-allowed disabled:opacity-50">
                            Reserve seat — 80 DH
                        </button>
                    </form>
                    <div id="reserve-notification" class="mt-3" aria-live="polite"></div>
                    <div id="ticket-preview" class="mt-3 hidden" role="status" aria-live="polite"></div>
                </section>

                <section aria-labelledby="modify-title"
                    class="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:p-5">
                    <h2 id="modify-title" class="mb-3 text-base font-bold text-slate-900">Modify reservation</h2>
                    <form id="modify-form" novalidate>
                        <label for="modify-passenger"
                            class="mb-1 block text-sm font-semibold text-slate-700">Passenger</label>
                        <select id="modify-passenger" name="modify-passenger"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pr-9 text-sm">
                            <option value="">Select a passenger…</option>
                        </select>
                        <label for="modify-name" class="mb-1 block text-sm font-semibold text-slate-700">Passenger
                            name</label>
                        <input id="modify-name" type="text" autocapitalize="none" enterkeyhint="done" autocomplete="off"
                            maxlength="60"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm placeholder:text-slate-400"
                            placeholder="Name appears after selecting a passenger" />
                        <label for="modify-seat" class="mb-1 block text-sm font-semibold text-slate-700">Destination
                            seat</label>
                        <select id="modify-seat"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pr-9 text-sm">
                            <option value="">No reservation selected</option>
                        </select>
                        <button type="submit"
                            class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-slate-800 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-slate-700 active:bg-slate-900 disabled:cursor-not-allowed disabled:opacity-50">
                            <i class="fa-solid fa-square-check"></i>
                            Save changes
                        </button>
                    </form>
                    <div id="modify-notification" class="mt-3" aria-live="polite"></div>
                </section>

                <section aria-labelledby="cancel-title"
                    class="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:p-5">
                    <h2 id="cancel-title" class="mb-3 text-base font-bold text-slate-900">Cancel reservation</h2>
                    <form id="cancel-form" novalidate>
                        <label for="cancel-passenger"
                            class="mb-1 block text-sm font-semibold text-slate-700">Passenger</label>
                        <select id="cancel-passenger" name="cancel-passenger"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pr-9 text-sm">
                            <option value="">Select a passenger…</option>
                        </select>
                        <p id="cancel-details" class="mb-3 text-sm text-slate-600 hidden"></p>
                        <button type="submit"
                            class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-rose-300 bg-rose-50 px-4 py-2.5 text-sm font-semibold text-rose-700 transition-colors hover:bg-rose-100 active:bg-rose-200 disabled:cursor-not-allowed disabled:opacity-50">
                            <i class="fa-solid fa-ban"></i>
                            Cancel-reservation
                        </button>
                    </form>
                    <div id="cancel-notification" class="mt-3" aria-live="polite"></div>
                </section>
            </div>
        </div>
